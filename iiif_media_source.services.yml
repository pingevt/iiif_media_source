services:
  iiif_media_source.iiif_img:
    class: Drupal\iiif_media_source\Iii\IiifImage
    arguments: ['@entity_type.manager', '@file_system', '@http_client']

  cache.iiif_media_source:
    class: Drupal\Core\Cache\CacheBackendInterface
    tags:
      - { name: cache.bin }
    factory: cache_factory:get
    arguments: ['iiif_media_source']
